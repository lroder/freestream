target-version = "py312"
# Enforced by the linter, and `ruff format` is deliberately NOT part of CI: the formatting here is laid out
# by hand, arguments grouped by what they are, and handing that to a tool would lose it.
line-length = 110

[lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "N",    # pep8-naming
    "ANN",  # flake8-annotations
    "C90",  # mccabe — complexity, which is comprehension (see max-complexity below)
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "ARG",  # unused arguments — a parameter nobody reads is a lie about the interface
    "ERA",  # commented-out code
    "PTH",  # pathlib over os.path
    "TRY",  # tryceratops
    "PL",   # pylint (the arg/branch/statement ceilings)
    "D",    # pydocstyle — SHAPE only; see the ignores
    "RUF",  # ruff's own, incl. RUF100: a `noqa` that stopped being needed is an ERROR
    "BLE",  # blind `except Exception`: a new blind catch must justify itself with a `noqa`
    "S",    # bandit. The server seals what it holds, so the security family is not optional
]
ignore = [
    # ---- deliberate patterns, not drift -------------------------------------------------------------
    "B008",     # function call in a default argument
    "ANN401",   # `Any` as an annotation, where a value genuinely is any
    "PLC0415",  # import inside a function, to break an import cycle
    "PLW0603",  # `global`, for lazy module singletons built once
    "TRY003",   # a long message to a raise — the message is the sentence a reader sees
    # ---- rules that would fight the house voice -----------------------------------------------------
    "D401",     # non-imperative mood. Docstrings here STATE WHAT A THING IS, and the mood is the voice
    "PLR2004",  # magic value in a comparison. Signal on a domain threshold, noise on `len(x) == 2`; run it
                # as an instrument (`ruff check --select PLR2004`) when auditing thresholds
    "RUF001", "RUF002", "RUF003",  # "ambiguous" unicode — we use — · ★ ⚠ → on purpose, everywhere
    # ---- bandit findings that are false here --------------------------------------------------------
    "S608",     # "hardcoded SQL expression" — there is no SQL; it misreads strings that look like it
    "S105",     # "possible hardcoded password" — a variable named `token` compared to a word
    "S108",     # "insecure temp file" — paths under /dev/shm and /tmp chosen deliberately
    # ---- a docstring exists because there is something to say ---------------------------------------
    # D100-D107 would mandate one on every module, class, method and __init__, and manufacture docstrings
    # that restate their own function's name. The SHAPE rules below stay on, so the docstrings we DO
    # write are all shaped alike.
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",
    # Two of pydocstyle's rules contradict two others by design; naming the loser keeps the build quiet:
    # no blank line before a class docstring (D211 over D203), and the summary on the FIRST line of a
    # multi-line docstring (D212 over D213).
    "D203", "D213",
    # ---- two D rules that fight prose this codebase gets right --------------------------------------
    "D400",     # "first line should end with a period" — it will not accept a question mark, and a
                # predicate documented as the question it answers is a good shape. D415 stays ON, so a
                # summary must still end in terminal punctuation.
    "D404",     # "docstring should not start with This" — aimed at "This function returns…", which is
                # not how "this" is used here.
]

[lint.pylint]
# Measured off this codebase rather than inherited from pylint's defaults: above where code normally sits,
# so the ceiling stops something new getting worse without demanding a rewrite.
max-args = 8
max-branches = 15    # matches the mccabe ceiling, so one number means one thing
max-statements = 50
# A dispatch chain, where each early return is one clean answer, trips a low return count without being
# tangled; max-complexity and max-branches measure tangle.
max-returns = 14

[lint.mccabe]
# A ratchet: each exception carries an explicit `# noqa: C901`, and RUF100 turns that marker into an
# ERROR the moment the function is simple enough not to need it.
max-complexity = 15

[lint.per-file-ignores]
# Return-type annotations on test functions and fixtures are ceremony: pytest discovers a test by name
# and everything returns None. Naming (N) still applies. Docstring shape does not: a test's docstring is
# often a full sentence about the scenario, and ARG/PLR ceilings fight long, explicit fixtures.
# Bandit cannot tell a fixture from a leak, so a test may hold a literal secret and unpickle what it just
# pickled. S603: one test spawns `sys.executable` with a literal from the test itself, because the
# partitioner must map a key the same way in a DIFFERENT interpreter, and Python's built-in hash is
# seeded per process.
"tests/**" = ["ANN", "D", "ARG", "PLR0913", "PLR2004", "S101", "S105", "S106", "S107", "S301",
              "S603"]

[format]
quote-style = "double"
indent-style = "space"
